spring.application.name=inventory-api

# --- Database: H2 in-memory (data is lost on restart, sample data is re-seeded) ---
spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Avoids N+1 selects when loading variants for a page of items
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:inventory)
spring.h2.console.enabled=true

# --- API ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
springdoc.swagger-ui.path=/swagger-ui.html

# --- Sample data (set to false to start with an empty database) ---
app.seed.enabled=true
